<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JKSTORE</title>
<meta name="theme-color" content="#FD1E23">
<meta property="og:title" content="JKSTORE">
<meta property="og:description" content="Maillots, chaussures, vêtements et accessoires. Commande sur WhatsApp.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
:root{--red:#FD1E23;--red2:#c9060b;--ink:#1d1d1f;--mut:#6b6b70;--soft:#f6f4f4;--line:#ececee;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--red);color:var(--ink);font:400 16px/1.5 Outfit,system-ui,sans-serif}
.top{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 58px;display:flex;align-items:center;justify-content:space-between}
.top img{width:54px;height:54px;border-radius:14px;background:#fff;object-fit:contain}
.top a{color:#fff;font-weight:600;font-size:14px;text-decoration:none;border:1.5px solid rgba(255,255,255,.75);border-radius:99px;padding:7px 15px}
.sheet{max-width:560px;margin:-44px auto 0;background:#fff;border-radius:28px 28px 0 0;padding:16px 18px calc(130px + env(safe-area-inset-bottom,0px));min-height:70vh;position:relative}
.gal{position:relative}
.gal .sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;scrollbar-width:none;border-radius:22px}
.gal .sl::-webkit-scrollbar{display:none}
.gal .sl>*{flex:none;width:100%;scroll-snap-align:center;aspect-ratio:4/5;border-radius:22px;border:1px solid var(--line);background:var(--soft);object-fit:cover}
.badge{position:absolute;top:12px;left:12px;background:var(--red);color:#fff;border-radius:99px;padding:5px 13px;font-weight:700;font-size:14px;box-shadow:0 4px 12px rgba(253,30,35,.35)}
.badge.out{background:#1d1d1f}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--red);width:20px;border-radius:99px}
.cat{color:var(--red);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:14px 0 2px}
h1{font-size:28px;line-height:1.15;margin:0 0 8px;letter-spacing:-.01em}
.pr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 6px}
.price{font-size:40px;font-weight:700;color:var(--red);letter-spacing:-.03em;line-height:1}
.old{font-size:20px;color:var(--mut);text-decoration:line-through}
.pct{background:var(--red);color:#fff;border-radius:8px;padding:2px 9px;font-weight:700;font-size:14px}
.desc{color:#3a3a3e;margin:10px 0 4px;white-space:pre-line}
h3{font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin:20px 0 8px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer;background:#999}
.sw button.on{outline:3px solid var(--red);outline-offset:2px}
.cn{color:var(--mut);font-size:14px;margin-top:6px}
.sz{display:flex;gap:8px;flex-wrap:wrap}
.sz span{min-width:46px;text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:7px 12px;font-weight:500}
.sz span{cursor:pointer}.sz span.on{background:var(--red);border-color:var(--red);color:#fff}.sz.need{animation:nd .5s 2}.sw.need{animation:nd .5s 2}@keyframes nd{50%{transform:translateX(5px)}}
.sz span.x{color:#b5b5ba;text-decoration:line-through;background:var(--soft)}
.info{background:var(--soft);border-radius:16px;padding:12px 14px;margin:18px 0;font-size:14px;color:#3a3a3e}
.info b{color:var(--red)}
.rel{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.rel a{flex:none;width:124px;color:inherit;text-decoration:none}
.rel img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:16px;background:var(--soft);border:1px solid var(--line)}
.rel b{display:block;font-weight:500;font-size:13px;line-height:1.25;margin-top:6px}
.rel span{color:var(--red);font-weight:700;font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.08);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.bar div{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;display:block;text-align:center;background:var(--red);color:#fff;border:0;border-radius:14px;padding:15px 16px;font:700 17px Outfit,sans-serif;text-decoration:none;cursor:pointer}
.btn.g{flex:none;background:#fff;color:var(--red);border:2px solid var(--red);padding:13px 16px;font-size:15px}
.btn.off{background:#b5b5ba;pointer-events:none}
.msg{text-align:center;padding:60px 10px;color:var(--mut)}
.msg b{display:block;color:var(--ink);font-size:20px;margin-bottom:8px}
.sk{height:380px;border-radius:22px;background:linear-gradient(90deg,var(--soft),#fff,var(--soft));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
</style></head><body>

  const pv=parseFloat(x.Price)||0,op=parseFloat(x.old_price)||0,st=x.Stock==null?1:+x.Stock,outs=st<=0?s.slice():csz(x.sizes_out);
  return{pid:x.id,n:x.Name,c:x.Category||"",p:pv,op:op>pv?op:0,d:x.Description||"",img:x.image_url||gal[0]||"",gal:gal.length?gal:(x.image_url?[x.image_url]:[]),cols,s,outs,bd:(x.badge||"").trim(),sold:s.length>0&&s.every(v=>outs.includes(v))};
}
function applyS(o){const n=(v,d)=>{const z=parseFloat(String(v).replace(",","."));return isNaN(z)?d:z};if(o.wa)WA=String(o.wa).replace(/\D/g,"")||WA;FEE=n(o.fee,FEE);if(o.delay)DELAY=o.delay}
let rows=null,shown=false,selS=null,selC=null;
function render(){
  const all=rows.filter(x=>x.Name).map(build),p=all.find(x=>x.pid===ID);
  const main=$("main");
  if(!p){main.innerHTML='<div class="msg"><b>Produit introuvable</b>Cet article n’est plus disponible ou le lien est incorrect.<br><br><a class="btn" href="index.html" style="display:inline-block;flex:none">Voir la boutique</a></div>';$("bar").hidden=true;document.title="JKSTORE";return}
  document.title=p.n+" – JKSTORE";
  const pct=p.op?Math.round((1-p.p/p.op)*100):0,badge=p.sold?'<span class="badge out">Épuisé</span>':(pct?`<span class="badge">−${pct}%</span>`:(p.bd?`<span class="badge">${e(p.bd)}</span>`:""));
  const rel=[...all.filter(x=>x.pid!==p.pid&&!x.sold&&x.c==p.c),...all.filter(x=>x.pid!==p.pid&&!x.sold&&x.c!=p.c)].slice(0,8);
  const link=x=>"produit.html?id="+x.pid+"&src="+encodeURIComponent(SRC);
  const imgs=p.gal;
  main.innerHTML=`<div class="gal"><div class="sl" id="sl">${imgs.length?imgs.map(u=>`<img src="${e(u)}" alt="${e(p.n)}" referrerpolicy="no-referrer">`).join(""):'<div></div>'}</div>${badge}</div>
  <div class="dots" id="dots"></div>
  ${p.c?`<div class="cat">${e(p.c)}</div>`:""}<h1>${e(p.n)}</h1>
  <div class="pr"><span class="price">${money(p.p)}</span>${p.op?`<span class="old">${money(p.op)}</span><span class="pct">−${pct}%</span>`:""}</div>
  ${p.d?`<p class="desc">${e(p.d)}</p>`:""}
  ${p.cols.length?`<h3>Couleurs</h3><div class="sw" id="sw">${p.cols.map((c,i)=>`<button data-i="${i}" aria-label="${e(c.name)}" style="background:${swc(c.name)}"></button>`).join("")}</div><div class="cn" id="cn">Touche une couleur pour voir la photo</div>`:""}
  <h3>${/^\d+$/.test(p.s[0]||"")?"Pointures":"Tailles"}</h3><div class="sz" id="szb">${p.s.map(v=>`<span class="${p.outs.includes(v)?"x":""}" data-v="${e(v)}">${e(v)}</span>`).join("")}</div>
  <div class="info"><b>Livraison</b> ${fcf(FEE)} à Kinshasa · ${e(DELAY)}<br><b>Paiement</b> à la livraison, Airtel Money ou M-Pesa<br><b>Commande</b> simple, confirmée avec toi sur WhatsApp</div>
  ${rel.length?`<h3>Tu aimeras aussi</h3><div class="rel">${rel.map(x=>`<a href="${e(link(x))}"><img src="${e(x.img)}" alt="" loading="lazy" referrerpolicy="no-referrer"><b>${e(x.n)}</b><span>${money(x.p)}</span></a>`).join("")}</div>`:""}`;
  // galerie : points + couleurs
  const sl=$("sl"),setDots=()=>{const n=sl.children.length,i=Math.round(sl.scrollLeft/(sl.clientWidth+10));$("dots").innerHTML=n>1?Array.from({length:n},(_,k)=>`<i class="${k===i?"on":""}"></i>`).join(""):""};
  setDots();sl.addEventListener("scroll",setDots);
  if(p.cols.length)$("sw").onclick=ev=>{const b=ev.target.closest("button");if(!b)return;const c=p.cols[+b.dataset.i];selC=c.name;updCta();[...$("sw").children].forEach(x=>x.classList.toggle("on",x===b));$("cn").textContent="Couleur : "+c.name;
    const list=c.images.length?c.images:imgs;sl.innerHTML=list.map(u=>`<img src="${e(u)}" alt="" referrerpolicy="no-referrer">`).join("");sl.scrollLeft=0;setDots()};
  // boutons
  $("bar").hidden=false;
  selS=null;selC=null;
  $("szb").onclick=ev=>{const sp=ev.target.closest("span");if(!sp||sp.classList.contains("x"))return;selS=sp.dataset.v;[...$("szb").children].forEach(x=>x.classList.toggle("on",x===sp));updCta()};
  window.updCta=()=>{const c=$("cta");if(p.sold){c.textContent="Article épuisé";c.className="btn off";c.removeAttribute("href");return}
    const ok=selS&&(!p.cols.length||selC);
    if(ok){c.className="btn";c.textContent="Commander · "+selS+(selC?" · "+selC:"");c.href="index.html?src="+encodeURIComponent(SRC)+"&add="+p.pid+"&s="+encodeURIComponent(selS)+"&c="+encodeURIComponent(selC||"")}
    else{c.className="btn";c.textContent=!selS?"Choisis ta taille pour commander":"Choisis ta couleur pour commander";c.removeAttribute("href")}};
  $("cta").onclick=ev=>{if(!$("cta").getAttribute("href")&&!p.sold){ev.preventDefault();const t=!selS?$("szb"):$("sw");if(t){t.classList.remove("need");void t.offsetWidth;t.classList.add("need");t.scrollIntoView({behavior:"smooth",block:"center"})}}};
  updCta();
  $("wa").href=`https://wa.me/${WA}?text=`+encodeURIComponent(`Bonjour JKSTORE, je suis intéressé par : ${p.n} (${money(p.p)}).\n${location.href.split("#")[0]}`);
  if(!shown){shown=true;track("product",p);try{if(!sessionStorage.getItem("jk_s")){sessionStorage.setItem("jk_s","1");track("visit")}}catch(_){track("visit")}}
}
async function start(){
  let cs=null,cp=null;try{cs=JSON.parse(localStorage.getItem("jk_cache_s")||"null");cp=JSON.parse(localStorage.getItem("jk_cache_p")||"null")}catch(_){}
  if(cs)applyS(cs);
  if(!ID){rows=[];render();return}
  if(cp&&Array.isArray(cp.rows)&&cp.rows.length){rows=cp.rows;render()}
  try{const [rs,rp]=await Promise.all([jfetch(SB.u+"/rest/v1/settings?select=key,value").catch(()=>null),(async()=>{let r=await jfetch(SB.u+"/rest/v1/products?select=*&is_active=eq.true&order=sort_order.asc,id.desc");if(!r.ok)r=await jfetch(SB.u+"/rest/v1/products?select=*&is_active=eq.true&order=id.desc");return r})()]);
    if(rs&&rs.ok){const o={};(await rs.json()).forEach(x=>o[x.key]=x.value);applyS(o);try{localStorage.setItem("jk_cache_s",JSON.stringify(o))}catch(_){}}
    if(rp.ok){rows=await rp.json();try{localStorage.setItem("jk_cache_p",JSON.stringify({t:Date.now(),rows}))}catch(_){}render()}
    else if(!rows){rows=[];render()}}
  catch(_){if(!rows){$("main").innerHTML='<div class="msg"><b>Connexion lente</b>Le produit ne se charge pas. <a href="" onclick="location.reload();return false" style="color:#FD1E23">Réessaie</a> ou <a href="index.html" style="color:#FD1E23">ouvre la boutique</a>.</div>'}}
}
start();
