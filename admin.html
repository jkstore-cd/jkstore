async function authCall(grant,body){
  const r=await fetch(SB.u+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{apikey:SB.k,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error_description||j.msg||j.message||"Connexion impossible");
  keepS({at:j.access_token,rt:j.refresh_token,email:(j.user&&j.user.email)||(S&&S.email)||""});
}
const jwtExp=t=>{try{return JSON.parse(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).exp*1000}catch(_){return 0}};
async function api(path,opt={}){
  if(!S)throw new Error("Non connecté");
  if(jwtExp(S.at)<Date.now()+60000){
    try{await authCall("refresh_token",{refresh_token:S.rt})}catch(err){keepS(null);go("login","Session expirée, reconnecte-toi.",true);throw err}
  }
  const h=Object.assign({apikey:SB.k,Authorization:"Bearer "+S.at},opt.headers||{});
  return fetch(SB.u+path,Object.assign({},opt,{headers:h}));
}
async function errText(r){
  const j=await r.json().catch(()=>({}));const m=j.message||j.msg||j.error||"";
  if(/old_price|column|schema cache|settings|orders|events|admin_stats|admin_set_order_status|function/i.test(m)&&r.status!=401&&r.status!=403)return "Il manque une mise à jour dans Supabase. Lance le code SQL « mise à jour 2 » envoyé par Claude. ("+m+")";
  if(r.status==401||r.status==403)return "Accès refusé. Vérifie que la sécurité Supabase (le code SQL) a bien été exécutée et que tu es connecté avec le bon e-mail.";

}

const cell=v=>{v=v==null?"":String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function downloadCsv(name,rows){
  const txt="\ufeff"+rows.map(r=>r.map(cell).join(",")).join("\r\n");
  const u=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
}

function draftDesc(p){
  const sh=/chauss|basket|crocs|sneaker|air force|puma|asics/i.test(p.Category||"");
  let s=csz(p.sizes);if(!s.length)s=sh?["38","39","40","41","42","43","44","45"]:["S","M","L","XL","XXL"];
  const j=s.join(","),t=(s.length===1&&/^unique$/i.test(s[0]))?"Taille unique.":j==="S,M,L,XL,XXL"?"Tailles : S à XXL.":j==="38,39,40,41,42,43,44,45"?"Pointures : 38 à 45.":(/^\d+$/.test(s[0])?"Pointures : ":"Tailles : ")+s.join(", ")+".";
  const cols=(Array.isArray(p.colors)?p.colors:[]).map(c=>c.name).filter(Boolean);
  let d=p.Name+". "+t;if(cols.length)d+=" Couleurs : "+cols.join(", ")+".";
  if(/^maillot/i.test(p.Category||"")||/^maillot/i.test(p.Name||""))d+=" Flocage personnalisé possible (nom et numéro).";

let suppressClick=0;
function initDrag(){
  const ls=$("ls");
  ls.onpointerdown=ev=>{
    const g=ev.target.closest(".grip");if(!g)return;
    ev.preventDefault();
    const items=[...ls.querySelectorAll(".item")],it=g.closest(".item"),i0=items.indexOf(it);if(i0<0)return;
    const rects=items.map(x=>{const r=x.getBoundingClientRect();return{top:r.top+scrollY,h:r.height}});
    const h0=rects[i0].h,startY=ev.clientY+scrollY;let cy=ev.clientY,target=i0,raf=0;
    try{g.setPointerCapture(ev.pointerId)}catch(_){}
    it.classList.add("drag");items.forEach(x=>{if(x!==it)x.style.transition="transform .15s"});
    const frame=()=>{
      const vh=innerHeight;if(cy<90)scrollBy(0,-14);else if(cy>vh-90)scrollBy(0,14);
      const dy=cy+scrollY-startY;it.style.transform="translateY("+dy+"px)";
      const mid=rects[i0].top+h0/2+dy;let t=0;
      items.forEach((x,k)=>{if(k!==i0&&rects[k].top+rects[k].h/2<mid)t++});
      target=t;
      items.forEach((x,k)=>{if(k===i0)return;let sh=0;if(k<i0&&k>=target)sh=h0;else if(k>i0&&k-1<target)sh=-h0;x.style.transform=sh?"translateY("+sh+"px)":""});
      raf=requestAnimationFrame(frame);
    };
    raf=requestAnimationFrame(frame);
    const mv=e=>{cy=e.clientY};
    const end=async()=>{
      cancelAnimationFrame(raf);g.removeEventListener("pointermove",mv);g.removeEventListener("pointerup",end);g.removeEventListener("pointercancel",end);
      suppressClick=Date.now();
      const order=items.filter(x=>x!==it);order.splice(target,0,it);
      items.forEach(x=>{x.style.transform="";x.style.transition=""});it.classList.remove("drag");
      order.forEach(x=>ls.appendChild(x));
      if(target===i0)return;
      const ids=order.map(x=>+x.dataset.id),byId=new Map(list.map(p=>[p.id,p]));
      list=ids.map(i=>byId.get(i)).filter(Boolean);
      await saveOrder(ids);
    };
    g.addEventListener("pointermove",mv);g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);
  };
}
function vividScore(url){return new Promise(res=>{if(!url)return res(null);const im=new Image();im.crossOrigin="anonymous";
  im.onload=()=>{try{const c=document.createElement("canvas");c.width=c.height=64;const g=c.getContext("2d");g.drawImage(im,0,0,64,64);const d=g.getImageData(0,0,64,64).data;let tot=0;
    for(let i=0;i<d.length;i+=4){const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]),v=mx/255,sa=mx?(mx-mn)/mx:0;if(v>0.15&&sa>0.25)tot+=sa*(0.5+0.5*v)}
    res(tot/4096)}catch(_){res(null)}};
  im.onerror=()=>res(null);im.src=url})}

  <div class="ob">${others.map(k=>`<button class="ghost${k=="annulee"?" red":""}" data-s="${k}">${k=="nouvelle"?"Remettre à traiter":k=="payee"?"Marquer payée":k=="livree"?"Marquer livrée":"Annuler"}</button>`).join("")}<a class="ghost" href="${e(wa)}" target="_blank" rel="noopener" style="text-decoration:none">WhatsApp client</a>${o.status=="annulee"?'<button class="ghost red" data-del="1">Supprimer</button>':""}</div></div>`;
}
let orders=[];
async function paneOrders(){
  $("pane").innerHTML=`<div class="chips" id="of"></div><div id="ol"><p class="mut">Chargement…</p></div><button class="ghost w" id="expo" style="margin-top:14px">Exporter les commandes (CSV)</button>
  <p class="mut">Quand tu annules une commande, le stock des articles est remis automatiquement.</p>`;
  $("expo").onclick=ev=>exportOrders(ev.target);
  const draw=()=>{
    const cnt=k=>k=="all"?orders.length:orders.filter(o=>o.status==k).length;
    $("of").innerHTML=[["all","Toutes"],...Object.entries(ST)].map(([k,l])=>`<button class="chip${ofilter==k?" on":""}" data-f="${k}">${l} (${cnt(k)})</button>`).join("");
    const a=orders.filter(o=>ofilter=="all"||o.status==ofilter);
    $("ol").innerHTML=a.length?a.map(orderHtml).join(""):'<p class="mut">Aucune commande ici pour l’instant.</p>';
  };
  try{const r=await api("/rest/v1/orders?select=*&order=id.desc&limit=300");if(!r.ok)throw new Error(await errText(r));orders=await r.json();draw()}
  catch(err){$("ol").innerHTML=`<div class="msg err">${e(err.message)}</div>`;return}
  $("of").onclick=ev=>{const f=ev.target.dataset.f;if(f){ofilter=f;draw()}};
  $("ol").onclick=async ev=>{
    const btn=ev.target.closest("button");if(!btn)return;const oc=btn.closest(".oc");if(!oc)return;const id=+oc.dataset.id;
    if(btn.dataset.s){
      if(btn.dataset.s=="annulee"&&!confirm("Annuler cette commande ? Le stock sera remis."))return;
      btn.disabled=true;
      const r=await api("/rest/v1/rpc/admin_set_order_status",{method:"POST",headers:JH,body:JSON.stringify({p_id:id,p_status:btn.dataset.s})});
      if(!r.ok){alert(await errText(r));btn.disabled=false;return}
      const o=orders.find(x=>x.id==id);if(o)o.status=btn.dataset.s;draw();refreshBadge();
    }else if(btn.dataset.del){
      if(!confirm("Supprimer définitivement cette commande ?"))return;
      const r=await api("/rest/v1/orders?id=eq."+id,{method:"DELETE"});
      if(!r.ok){alert(await errText(r));return}
      orders=orders.filter(x=>x.id!=id);draw();
    }
  };
}

/* ---------- onglet Statistiques ---------- */
async function paneStocks(){
  $("pane").innerHTML=`<div class="mut" style="margin-bottom:6px">Change les chiffres, puis appuie sur « Enregistrer les stocks ». L’alerte se déclenche à ${LOW} article${LOW>1?"s":""} ou moins (réglable dans Réglages).</div><div class="chips" id="sf"></div><div id="sl"><p class="mut">Chargement…</p></div><button class="btn" id="ssv" style="position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:12px" disabled>Enregistrer les stocks</button>`;
  try{await loadList()}catch(err){$("sl").innerHTML=`<div class="msg err">${e(err.message)}</div>`;return}
  const val=p=>sedits.has(p.id)?sedits.get(p.id):(+p.Stock||0);
  const stt=v=>v<=0?"out":v<=LOW?"low":"ok";
  const tagH=v=>stt(v)=="out"?'<span class="tag out">Épuisé</span>':stt(v)=="low"?'<span class="tag" style="background:#fff1d6;color:#8a5a00">Bas</span>':"";
  const draw=()=>{
    const act=list.filter(p=>p.is_active),cnt={all:list.length,low:act.filter(p=>stt(val(p))=="low").length,out:act.filter(p=>stt(val(p))=="out").length};
    $("sf").innerHTML=[["all","Tous"],["low","Stock bas"],["out","Épuisés"]].map(([k,l])=>`<button class="chip${sf==k?" on":""}" data-f="${k}">${l} (${cnt[k]})</button>`).join("");
    const rows=list.filter(p=>sf=="all"||(p.is_active&&stt(val(p))==sf));
    $("sl").innerHTML=rows.length?rows.map(p=>{const v=val(p),ch=sedits.has(p.id)&&v!==(+p.Stock||0);
      return `<div class="srow${ch?" chg":""}" data-id="${p.id}">${p.image_url?`<img src="${e(p.image_url)}" alt="" loading="lazy">`:'<div class="nop">Photo</div>'}<div class="t"><b>${e(p.Name)}</b><span class="mut">${e(p.Category||"—")}${p.is_active?"":" · Masqué"}</span> <span class="tg">${tagH(v)}</span></div><div class="stp"><button data-d="-1" aria-label="Moins">−</button><input type="number" inputmode="numeric" min="0" value="${v}"><button data-d="1" aria-label="Plus">+</button></div></div>`}).join(""):'<p class="mut">Aucun produit ici.</p>';
    sync2();
  };
  const sync2=()=>{$("ssv").disabled=![...sedits].some(([id,v])=>{const p=list.find(x=>x.id==id);return p&&(+p.Stock||0)!==v})};
  const setV=(row,v)=>{const id=+row.dataset.id,p=list.find(x=>x.id==id);if(!p)return;
    if(v===(+p.Stock||0))sedits.delete(id);else sedits.set(id,v);
    row.classList.toggle("chg",sedits.has(id));row.querySelector(".tg").innerHTML=tagH(v);sync2()};
  $("sf").onclick=ev=>{const f=ev.target.dataset.f;if(f){sf=f;draw()}};
  $("sl").onclick=ev=>{const b=ev.target.closest("[data-d]");if(!b)return;const row=b.closest(".srow"),inp=row.querySelector("input");
    const v=Math.max(0,(parseInt(inp.value,10)||0)+(+b.dataset.d));inp.value=v;setV(row,v)};
  $("sl").oninput=ev=>{if(ev.target.tagName!="INPUT")return;const v=parseInt(ev.target.value,10);if(isNaN(v)||v<0)return;setV(ev.target.closest(".srow"),v)};
  $("ssv").onclick=async()=>{
    const todo=[...sedits].filter(([id,v])=>{const p=list.find(x=>x.id==id);return p&&(+p.Stock||0)!==v});if(!todo.length)return;
    const b=$("ssv"),t=b.textContent;b.disabled=true;let i=0;
    try{for(const [id,v] of todo){b.textContent="Enregistrement "+(++i)+"/"+todo.length+"…";
        const r=await api("/rest/v1/products?id=eq."+id,{method:"PATCH",headers:{...JH,Prefer:"return=minimal"},body:JSON.stringify({Stock:v})});
        if(!r.ok)throw new Error(await errText(r));const p=list.find(x=>x.id==id);if(p)p.Stock=v;sedits.delete(id)}
      toast(todo.length+" stock"+(todo.length>1?"s":"")+" enregistré"+(todo.length>1?"s":"")+" ✓")}
    catch(err){toast(err.message,true)}
    b.textContent=t;draw();refreshBadge();
  };
  draw();
}
const SRCN={direct:"Direct ou inconnu",tiktok:"TikTok",instagram:"Instagram",whatsapp:"WhatsApp",partage:"Lien partagé par un client",facebook:"Facebook",google:"Google"};
async function paneStats(){
  $("pane").innerHTML=`<div class="chips">${[7,30,90].map(d=>`<button class="chip${sdays==d?" on":""}" data-d="${d}">${d} jours</button>`).join("")}</div><div id="sb"><p class="mut">Chargement…</p></div>`;
  $("pane").querySelector(".chips").onclick=ev=>{const d=+ev.target.dataset.d;if(d){sdays=d;paneStats()}};
  try{
    const r=await api("/rest/v1/rpc/admin_stats",{method:"POST",headers:JH,body:JSON.stringify({p_days:sdays})});
    if(!r.ok)throw new Error(await errText(r));
    const s=await r.json(),days=s.days||[],mx=Math.max(1,...days.map(d=>d.visits)),top=s.top||[],tmx=Math.max(1,...top.map(t=>t.views));
    $("sb").innerHTML=`<div class="cards">
    <div class="card"><b>${s.visits}</b><span class="mut">Visites</span></div>
    <div class="card"><b>${s.visitors}</b><span class="mut">Visiteurs différents</span></div>
    <div class="card"><b>${s.product_views}</b><span class="mut">Fiches produit ouvertes</span></div>
    <div class="card"><b>${s.carts}</b><span class="mut">Ajouts au panier</span></div>
    <div class="card"><b>${s.orders}</b><span class="mut">Commandes</span></div>
    <div class="card"><b>${money(s.revenue)}</b><span class="mut">Ventes (articles)</span></div></div>
    <h2>D’où viennent les visites</h2>
    ${(s.sources||[]).length?(s.sources||[]).map(x=>`<div class="tp"><div style="display:flex;justify-content:space-between;gap:8px"><b>${e(SRCN[x.src]||x.src)}</b><span class="mut">${x.visits} visites · ${x.orders} commande${x.orders>1?"s":""}</span></div><div class="bar"><i style="width:${Math.round(x.visits/Math.max(1,...(s.sources||[]).map(y=>y.visits))*100)}%"></i></div></div>`).join(""):'<p class="mut">Pas encore de données. Utilise les liens de l’onglet Réglages dans tes bios.</p>'}
    <h2>Visites par jour</h2>
    <div class="bars">${days.map(d=>`<i title="${e(d.d)} : ${d.visits}" style="height:${Math.max(2,Math.round(d.visits/mx*100))}%"></i>`).join("")}</div>
    <div class="mut" style="display:flex;justify-content:space-between"><span>${e(days.length?days[0].d:"")}</span><span>max ${mx}/jour</span><span>${e(days.length?days[days.length-1].d:"")}</span></div>
    <h2>Produits les plus consultés</h2>
    ${top.length?top.map(t=>`<div class="tp"><div style="display:flex;justify-content:space-between;gap:8px"><b style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e(t.name)}</b><span class="mut" style="flex:none">${t.views} vues · ${t.carts} panier</span></div><div class="bar"><i style="width:${Math.round(t.views/tmx*100)}%"></i></div></div>`).join(""):'<p class="mut">Pas encore de données. Les statistiques se remplissent quand des clients visitent le site.</p>'}
    <button class="ghost w" id="purge" style="margin-top:14px">Supprimer les statistiques de plus de 90 jours</button>
    <p class="mut" style="margin-top:14px">Tes propres visites ne sont pas comptées sur cet appareil (réglable dans Réglages). Les visites d’un même téléphone sont comptées une fois par session.</p>`;
    $("purge").onclick=async()=>{if(!confirm("Supprimer les statistiques de plus de 90 jours ? Les commandes ne sont pas touchées."))return;
      const r2=await api("/rest/v1/rpc/admin_purge_events",{method:"POST",headers:JH,body:JSON.stringify({p_days:90})});
      if(!r2.ok){alert(await errText(r2));return}const n=await r2.json();toast(n+" ligne"+(n>1?"s":"")+" supprimée"+(n>1?"s":""))};
  }catch(err){$("sb").innerHTML=`<div class="msg err">${e(err.message)}</div>`}
}

/* ---------- onglet Réglages ---------- */
const SET_KEYS=["wa","fee","delay","fl","fl2","pay_airtel","pay_mpesa","banner"];
async function paneSettings(){
  $("pane").innerHTML='<p class="mut">Chargement…</p>';
  let o={};
  try{const r=await api("/rest/v1/settings?select=key,value");if(!r.ok)throw new Error(await errText(r));(await r.json()).forEach(x=>o[x.key]=x.value)}
  catch(err){$("pane").innerHTML=`<div class="msg err">${e(err.message)}</div>`;return}
  const nt=(()=>{try{return !!localStorage.getItem("jk_notrack")}catch(_){return false}})();
  $("pane").innerHTML=`<div id="sm"></div>
  <label for="s_wa">Numéro WhatsApp de la boutique (avec l’indicatif, sans +)</label><input id="s_wa" inputmode="numeric" value="${e(o.wa)}" placeholder="243824871399">
  <label for="s_bn">Bannière d’annonce en haut du site (vide = aucune)</label><input id="s_bn" value="${e(o.banner)}" placeholder="Ex : Promo du week-end −20%">
  <h2>Alerte de stock</h2>
  <label for="s_low">Prévenir quand il reste ce nombre d’articles ou moins</label><input id="s_low" inputmode="numeric" value="${e(o.low_stock||LOW)}">
  <h2>Livraison</h2>
  <label for="s_fee">Frais de livraison (FC)</label><input id="s_fee" inputmode="numeric" value="${e(o.fee)}">
  <label for="s_delay">Délai de livraison</label><input id="s_delay" value="${e(o.delay)}" placeholder="24 à 48 h">
  <h2>Flocage maillots ($)</h2>
  <label for="s_fl">Flocage simple</label><input id="s_fl" inputmode="decimal" value="${e(o.fl)}">
  <label for="s_fl2">Double flocage</label><input id="s_fl2" inputmode="decimal" value="${e(o.fl2)}">
  <h2>Paiement</h2>
  <label for="s_pa">Numéro Airtel Money</label><input id="s_pa" value="${e(o.pay_airtel)}">
  <label for="s_pm">Numéro M-Pesa</label><input id="s_pm" value="${e(o.pay_mpesa)}">
  <h2>Réseaux sociaux</h2>
  <label for="s_ig">Lien Instagram (vide = masqué)</label><input id="s_ig" value="${e(o.instagram==null?DEF_IG:o.instagram)}">
  <label for="s_tk">Lien TikTok (vide = masqué)</label><input id="s_tk" value="${e(o.tiktok==null?DEF_TK:o.tiktok)}">
  <h2>Conditions et confidentialité</h2>
  <div class="mut">Texte affiché en bas du site. Les titres commencent par ##. Tu peux écrire {fee} et {delay} : ils sont remplacés par les vrais frais et délai de livraison.</div>
  <textarea id="s_tm" rows="14" style="margin-top:8px">${e(o.terms||DEF_TERMS)}</textarea>
  <button class="ghost w" id="s_tr">Remettre le texte par défaut</button>
  <h2>Mes liens à copier</h2>
  <div class="mut">À mettre dans tes bios et tes messages. L’onglet Stats montre combien de visites et de commandes vient de chaque lien.</div>
  ${[["TikTok","tiktok"],["Instagram","instagram"],["WhatsApp","whatsapp"]].map(([l,k])=>{const u=new URL("./?src="+k,location.href).href;return `<label>${l}</label><div class="cr" style="margin:4px 0 10px"><input readonly value="${e(u)}" style="margin:0"><button class="ghost" data-cp="${e(u)}">Copier</button></div>`}).join("")}
  <h2>Cet appareil</h2>
  <label class="chk"><input type="checkbox" id="s_nt" ${nt?"checked":""}>Ne pas compter mes visites dans les statistiques</label>
  <button class="btn" id="s_sv">Enregistrer les réglages</button>
  <p class="mut" style="margin-top:12px">Les changements sont visibles sur le site dès le prochain chargement de la page.</p>`;
  $("pane").querySelectorAll("[data-cp]").forEach(b=>b.onclick=async()=>{await copyText(b.dataset.cp);toast("Lien copié ✓")});
  $("s_tr").onclick=()=>{$("s_tm").value=DEF_TERMS};
  $("s_nt").onchange=ev=>{try{if(ev.target.checked){localStorage.setItem("jk_notrack","1");localStorage.removeItem("jk_notrack_off")}else{localStorage.removeItem("jk_notrack");localStorage.setItem("jk_notrack_off","1")}}catch(_){}};
  $("s_sv").onclick=async()=>{
    const say=(m,bad)=>{const el=$("sm");el.innerHTML=`<div class="msg${bad?" err":" ok"}">${e(m)}</div>`;window.scrollTo(0,0)};
    const wa=$("s_wa").value.replace(/\D/g,""),fee=num($("s_fee").value),fl=num($("s_fl").value),fl2=num($("s_fl2").value);
    if(wa.length<8)return say("Le numéro WhatsApp doit contenir l’indicatif et le numéro (chiffres seulement).",true);
    if(isNaN(fee)||fee<0)return say("Les frais de livraison doivent être un nombre (en FC).",true);
    if(isNaN(fl)||fl<0||isNaN(fl2)||fl2<0)return say("Les prix de flocage doivent être des nombres (par exemple 4.99).",true);
    if(!$("s_delay").value.trim())return say("Indique un délai de livraison.",true);
    const ig=$("s_ig").value.trim(),tk=$("s_tk").value.trim(),tm=$("s_tm").value.trim();
    if((ig&&!/^https?:\/\//i.test(ig))||(tk&&!/^https?:\/\//i.test(tk)))return say("Les liens Instagram et TikTok doivent commencer par https://",true);
    const low=parseInt($("s_low").value,10);if(isNaN(low)||low<1)return say("L’alerte de stock doit être un nombre entier (par exemple 3).",true);
    const b=$("s_sv");b.disabled=true;b.textContent="Enregistrement…";
    const rows=[{key:"low_stock",value:String(low)},{key:"instagram",value:ig},{key:"tiktok",value:tk},{key:"terms",value:tm===DEF_TERMS.trim()?"":tm},{key:"wa",value:wa},{key:"fee",value:String(fee)},{key:"delay",value:$("s_delay").value.trim()},{key:"fl",value:String(fl)},{key:"fl2",value:String(fl2)},{key:"pay_airtel",value:$("s_pa").value.trim()},{key:"pay_mpesa",value:$("s_pm").value.trim()},{key:"banner",value:$("s_bn").value.trim()}];
    try{const r=await api("/rest/v1/settings?on_conflict=key",{method:"POST",headers:{...JH,Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(rows)});
      if(!r.ok)throw new Error(await errText(r));LOW=low;say("Réglages enregistrés. Le site est à jour.");refreshBadge()}
    catch(err){say(err.message,true)}
    b.disabled=false;b.textContent="Enregistrer les réglages";
  };
}
render();
