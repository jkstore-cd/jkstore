<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>JKSTORE · Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
:root{--red:#FD1E23;--bg:#fff;--soft:#f6f4f4;--ink:#1d1d1f;--mut:#6b6b70;--line:#ececee;--ok:#1f8a4c;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#17171a;--soft:#222226;--ink:#f3f3f4;--mut:#a5a5ab;--line:#333338;--ok:#46c47c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Outfit,system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:600px;margin:0 auto;padding:16px 18px 70px}
h1{font-size:24px;margin:6px 0 12px}
h2{font-size:18px;margin:20px 0 6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{display:block;width:100%;background:var(--red);color:#fff;border:0;border-radius:12px;padding:14px 18px;font:600 16px Outfit,sans-serif;cursor:pointer;text-align:center}
.btn[disabled]{opacity:.5}
.ghost{background:var(--soft);color:var(--ink);border:0;border-radius:10px;padding:9px 14px;font:500 15px Outfit,sans-serif;cursor:pointer}
.ghost.w{width:100%;margin:6px 0;display:block;text-align:center;text-decoration:none}
.danger{background:none;border:1.5px solid var(--red);color:var(--red);border-radius:12px;padding:12px;width:100%;font:600 15px Outfit,sans-serif;margin-top:10px}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;font:16px Outfit,sans-serif;background:var(--bg);color:var(--ink);margin:6px 0 12px}
label{font-weight:600;font-size:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:4px 0 12px;scrollbar-width:none}
.tab{flex:1;white-space:nowrap;border:0;background:var(--soft);color:var(--ink);border-radius:10px;padding:10px 8px;font:600 14px Outfit,sans-serif;cursor:pointer}
.tab.on{background:var(--red);color:#fff}
.nb{display:inline-block;background:var(--red);color:#fff;border-radius:99px;padding:0 7px;font-size:12px;margin-left:3px}
.tab.on .nb{background:#fff;color:var(--red)}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item img,.item .nop{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--soft);flex:none;display:grid;place-items:center;font-size:11px;color:var(--mut)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;background:var(--soft);margin-right:4px}
.tag.off{background:#6b6e73;color:#fff}.tag.out{background:var(--red);color:#fff}.tag.promo{background:#ffe3e3;color:var(--red)}
.tag.s-nouvelle{background:#fff1d6;color:#8a5a00}.tag.s-payee{background:#dff3e6;color:#1f6b3a}.tag.s-livree{background:#dde9ff;color:#2446a0}.tag.s-annulee{background:#6b6e73;color:#fff}
.msg{margin:10px 0;padding:10px 12px;border-radius:10px;font-size:14px;background:var(--soft)}
.msg.err{color:var(--red)}
.msg.ok{color:var(--ok)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 8px}
.th{position:relative;width:84px;height:84px}
.th img{width:100%;height:100%;object-fit:cover;border-radius:10px;background:var(--soft)}
.th .x{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:16px;line-height:1}
.th .st{position:absolute;bottom:3px;left:3px;border:0;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:2px 7px}
.th .mn{position:absolute;bottom:3px;left:3px;border-radius:8px;background:var(--red);color:#fff;font-size:11px;padding:1px 7px}
.cb{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0}
.cr{display:flex;gap:8px;align-items:center}
.cr input{margin:0}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none}
.chk{display:flex;align-items:center;gap:10px;margin:4px 0 14px;font-weight:500}
.chk input{width:auto;margin:0}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:6px 14px;font:500 14px Outfit,sans-serif;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.oc{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.oc .oh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.oc .its{margin:8px 0;padding:8px 10px;background:var(--soft);border-radius:10px;font-size:14px}
.ob{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ob .ghost{padding:8px 12px;font-size:14px}
.ob .ghost.red{color:var(--red)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.card{background:var(--soft);border-radius:14px;padding:12px}
.card b{display:block;font-size:26px;line-height:1.1}
.bars{display:flex;align-items:flex-end;gap:2px;height:110px;margin:10px 0 4px}
.bars i{flex:1;background:var(--red);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.tp{margin:8px 0}
.tp .bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:3px}
.tp .bar i{display:block;height:100%;background:var(--red)}
[hidden]{display:none!important}
</style></head><body>
<div class="wrap" id="app"></div>
<script>
const SB={u:"https://nunhbbvfqfmwvfsauiwy.supabase.co",k:"sb_publishable_38SZCvwKGi1I4DUYXjHqIg_7muHScfZ"};
const BUCKET="product-images";
const CC={blanc:"#fff",noir:"#111",rouge:"#d32f2f",bleu:"#3b6fd4",marron:"#7b5a3c",violet:"#8e5bd0",rose:"#f06eb5",vert:"#1f5a3f",beige:"#d8cdb8",bordeaux:"#6e1424","rouge bordeaux":"#6e1424","bleu de nuit":"#14204a",jaune:"#f2c200",gris:"#8a8a8a","gris clair":"#bdbdbd",camel:"#c19a6b","gris foncé":"#4a4a4f",orange:"#f28a1e",lilas:"#c8b6d6","bleu ciel":"#8fb4e3","vert d'eau":"#6fbfa5","bleu gris":"#6a7a9a","bleu marine":"#1b2a4a",taupe:"#b09080",kaki:"#6b6e5c",anthracite:"#34353d","vert foncé":"#1f5a3f","crème":"#efe3cf",camouflage:"linear-gradient(135deg,#6b5b3a 0 34%,#2f3a2a 34% 67%,#c9b98a 67%)",turquoise:"#1e9bb8","bleu roi":"#2a3a9a","noir logo":"linear-gradient(180deg,#111 0 42%,#e4e4e4 42% 58%,#111 58%)"};
const $=id=>document.getElementById(id);
const e=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app=$("app");
let S=null,list=[],cur=null,note="",noteErr=false,noteOk=false,view="login",tab="products",q="",ofilter="all",sdays=30,newCount=0;
try{S=JSON.parse(localStorage.getItem("jk_admin")||"null")}catch(_){}
if(S)view="main";
const keepS=s=>{S=s;try{s?localStorage.setItem("jk_admin",JSON.stringify(s)):localStorage.removeItem("jk_admin")}catch(_){}};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const dot=n=>{const p=String(n||"").toLowerCase().split("/").map(x=>CC[x.trim()]||"#999");return p.length>1?`linear-gradient(135deg,${p[0]} 50%,${p[1]} 50%)`:p[0]};
const csz=s=>String(s||"").split(/[,;\/]/).map(v=>v.trim()).filter(Boolean);
const money=n=>(Math.round((+n||0)*100)/100).toFixed(2).replace(".",",")+" $";
const fcf=n=>String(Math.round(+n||0)).replace(/\B(?=(\d{3})+(?!\d))/g," ")+" FC";
const dfmt=v=>{try{return new Date(v).toLocaleString("fr-FR",{timeZone:"Africa/Kinshasa",dateStyle:"short",timeStyle:"short"})}catch(_){return v}};
const today=()=>new Date().toISOString().slice(0,10);

/* ---------- connexion ---------- */
async function authCall(grant,body){
  const r=await fetch(SB.u+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{apikey:SB.k,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error_description||j.msg||j.message||"Connexion impossible");
  keepS({at:j.access_token,rt:j.refresh_token,email:(j.user&&j.user.email)||(S&&S.email)||""});
}
const jwtExp=t=>{try{return JSON.parse(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).exp*1000}catch(_){return 0}};
async function api(path,opt={}){
  if(!S)throw new Error("Non connecté");
  if(jwtExp(S.at)<Date.now()+60000){
    try{await authCall("refresh_token",{refresh_token:S.rt})}catch(err){keepS(null);go("login","Session expirée, reconnecte-toi.",true);throw err}
  }
  const h=Object.assign({apikey:SB.k,Authorization:"Bearer "+S.at},opt.headers||{});
  return fetch(SB.u+path,Object.assign({},opt,{headers:h}));
}
async function errText(r){
  const j=await r.json().catch(()=>({}));const m=j.message||j.msg||j.error||"";
  if(/old_price|column|schema cache|settings|orders|events|admin_stats|admin_set_order_status|function/i.test(m)&&r.status!=401&&r.status!=403)return "Il manque une mise à jour dans Supabase. Lance le code SQL « mise à jour 2 » envoyé par Claude. ("+m+")";
  if(r.status==401||r.status==403)return "Accès refusé. Vérifie que la sécurité Supabase (le code SQL) a bien été exécutée et que tu es connecté avec le bon e-mail.";
  return m||("Erreur "+r.status);
}
const JH={"Content-Type":"application/json"};
function go(v,m,isErr,isOk){view=v;note=m||"";noteErr=!!isErr;noteOk=!!isOk;render()}
const msg=()=>note?`<div class="msg${noteErr?" err":noteOk?" ok":""}">${e(note)}</div>`:"";
function render(){if(view=="login")return renderLogin();if(view=="form")return renderForm();renderShell()}
function logout(){keepS(null);list=[];go("login")}

function renderLogin(){
  app.innerHTML=`<h1>JKSTORE · Admin</h1>${msg()}
  <label for="em">E-mail</label><input id="em" type="email" autocomplete="username" inputmode="email" autocapitalize="none">
  <label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn" id="go">Se connecter</button>`;
  const doLogin=async()=>{const b=$("go");b.disabled=true;b.textContent="Connexion…";
    try{await authCall("password",{email:$("em").value.trim(),password:$("pw").value});
      try{if(!localStorage.getItem("jk_notrack_off"))localStorage.setItem("jk_notrack","1")}catch(_){}
      tab="products";go("main")}
    catch(err){b.disabled=false;b.textContent="Se connecter";const t=err.message=="Invalid login credentials"?"E-mail ou mot de passe incorrect.":err.message;let m=app.querySelector(".msg");if(!m){app.querySelector("h1").insertAdjacentHTML("afterend",'<div class="msg err"></div>');m=app.querySelector(".msg")}m.className="msg err";m.textContent=t}};
  $("go").onclick=doLogin;$("pw").onkeydown=ev=>{if(ev.key=="Enter")doLogin()};
}

/* ---------- coque avec onglets ---------- */
const TITLES={products:"Mes produits",orders:"Commandes",stats:"Statistiques",settings:"Réglages"};
function renderShell(){
  const tabs=[["products","Produits"],["orders","Commandes"+(newCount?` <span class="nb">${newCount}</span>`:"")],["stats","Stats"],["settings","Réglages"]];
  app.innerHTML=`<div class="top"><h1>${TITLES[tab]}</h1><button class="ghost" id="lo">Déconnexion</button></div>
  <div class="tabs">${tabs.map(([k,l])=>`<button class="tab${tab==k?" on":""}" data-t="${k}">${l}</button>`).join("")}</div>${msg()}<div id="pane"></div>`;
  $("lo").onclick=logout;
  app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.t;go("main")});
  ({products:paneProducts,orders:paneOrders,stats:paneStats,settings:paneSettings})[tab]();
  refreshBadge();
}
async function refreshBadge(){
  try{const r=await api("/rest/v1/orders?select=id&status=eq.nouvelle");if(!r.ok)return;const n=(await r.json()).length;
    if(n!=newCount){newCount=n;const t=app.querySelector('.tab[data-t="orders"]');if(t)t.innerHTML="Commandes"+(n?` <span class="nb">${n}</span>`:"")}}catch(_){}
}

/* ---------- CSV ---------- */
const cell=v=>{v=v==null?"":String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function downloadCsv(name,rows){
  const txt="\ufeff"+rows.map(r=>r.map(cell).join(",")).join("\r\n");
  const u=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
}
async function exportProducts(btn){
  btn.disabled=true;const t=btn.textContent;btn.textContent="Préparation…";
  try{const r=await api("/rest/v1/products?select=*&order=id.asc");if(!r.ok)throw new Error(await errText(r));const a=await r.json();
    const rows=[["id","Name","Category","Price","old_price","Stock","is_active","badge","sizes","sizes_out","Description","image_url","images","colors_json","created_at"]];
    a.forEach(p=>rows.push([p.id,p.Name,p.Category,p.Price,p.old_price,p.Stock,p.is_active,p.badge,p.sizes,p.sizes_out,p.Description,p.image_url,(p.images||[]).join(" | "),JSON.stringify(p.colors||[]),p.created_at]));
    downloadCsv("jkstore-produits-"+today()+".csv",rows);btn.textContent="Fichier prêt ✓"}
  catch(err){btn.textContent=t;alert(err.message)}
  btn.disabled=false;setTimeout(()=>{btn.textContent=t},2500);
}
const itemTxt=i=>`${i.qty}x ${i.name}${i.size?" · "+i.size:""}${i.color?" · "+i.color:""}${i.fx?" · flocage "+[i.fx.nm,i.fx.nu,i.fx.z].filter(Boolean).join("/"):""}`;
async function exportOrders(btn){
  btn.disabled=true;const t=btn.textContent;btn.textContent="Préparation…";
  try{const r=await api("/rest/v1/orders?select=*&order=id.asc");if(!r.ok)throw new Error(await errText(r));const a=await r.json();
    const rows=[["ref","date","statut","client","telephone","commune","quartier","adresse","repere","paiement","articles","sous_total_usd","livraison_fc","code"]];
    a.forEach(o=>rows.push([o.ref,dfmt(o.created_at),ST[o.status]||o.status,o.customer_name,o.phone,o.commune,o.quartier,o.address,o.landmark,o.pay_method,(o.items||[]).map(itemTxt).join(" ; "),o.subtotal,o.delivery_fee,o.promo_code]));
    downloadCsv("jkstore-commandes-"+today()+".csv",rows);btn.textContent="Fichier prêt ✓"}
  catch(err){btn.textContent=t;alert(err.message)}
  btn.disabled=false;setTimeout(()=>{btn.textContent=t},2500);
}

/* ---------- onglet Produits ---------- */
async function loadList(){
  const r=await api("/rest/v1/products?select=*&order=id.desc");
  if(!r.ok)throw new Error(await errText(r));
  list=await r.json();
}
function listHtml(){
  const w=q.trim().toLowerCase(),a=list.filter(p=>!w||(p.Name+" "+(p.Category||"")).toLowerCase().includes(w));
  if(!list.length)return '<p class="mut">Aucun produit pour l’instant. Appuie sur « Ajouter un produit ».</p>';
  if(!a.length)return '<p class="mut">Aucun résultat.</p>';
  return a.map(p=>{const nc=Array.isArray(p.colors)?p.colors.length:0,op=+p.old_price||0,pr=+p.Price||0;
  return `<div class="item" data-id="${p.id}">${p.image_url?`<img src="${e(p.image_url)}" alt="" loading="lazy">`:`<div class="nop">Photo</div>`}
  <div class="t"><b>${e(p.Name)}</b><span class="mut">${e(p.Category||"—")} · ${e(p.Price)} $${nc?" · "+nc+" couleur"+(nc>1?"s":""):""}</span><br>${p.is_active?"":'<span class="tag off">Masqué</span>'}${(p.Stock||0)<=0?'<span class="tag out">Épuisé</span>':'<span class="tag">Stock '+e(p.Stock)+'</span>'}${op>pr?`<span class="tag promo">Promo −${Math.round((1-pr/op)*100)}%</span>`:""}${p.badge?`<span class="tag">${e(p.badge)}</span>`:""}</div><span class="mut">›</span></div>`}).join("");
}
async function paneProducts(){
  $("pane").innerHTML=`<button class="btn" id="new">+ Ajouter un produit</button>
  <input id="sq" type="search" placeholder="Rechercher un produit…" value="${e(q)}" style="margin-top:12px">
  <div id="ls"><p class="mut">Chargement…</p></div>
  <h2>Outils</h2><a class="ghost w" href="index.html" target="_blank">Voir le site ›</a>
  <button class="ghost w" id="exp">Exporter les produits (CSV)</button>
  <p class="mut" style="margin-top:14px">Connecté : ${e(S&&S.email)}</p>`;
  $("new").onclick=()=>{cur=blank();go("form")};
  $("exp").onclick=ev=>exportProducts(ev.target);
  $("sq").oninput=ev=>{q=ev.target.value;$("ls").innerHTML=listHtml()};
  try{await loadList()}catch(err){$("ls").innerHTML=`<div class="msg err">${e(err.message)}</div>`;return}
  $("ls").innerHTML=listHtml();
  $("ls").onclick=ev=>{const it=ev.target.closest(".item");if(!it)return;cur=fromRow(list.find(x=>x.id==it.dataset.id));go("form")};
}

/* ---------- formulaire produit ---------- */
const blank=()=>({isNew:true,Name:"",Category:"",Price:"",old_price:"",Description:"",Stock:10,is_active:true,badge:"",sizes:"",sizes_out:"",images:[],colors:[]});
function fromRow(r){
  const imgs=Array.isArray(r.images)?r.images.filter(Boolean):[];
  if(!imgs.length&&r.image_url)imgs.push(r.image_url);
  return{id:r.id,Name:r.Name||"",Category:r.Category||"",Price:r.Price==null?"":r.Price,old_price:r.old_price==null?"":r.old_price,Description:r.Description||"",Stock:r.Stock==null?0:r.Stock,is_active:r.is_active!==false,badge:r.badge||"",sizes:r.sizes||"",sizes_out:r.sizes_out||"",images:imgs,
    colors:(Array.isArray(r.colors)?r.colors:[]).map(c=>({name:c.name||"",images:Array.isArray(c.images)?c.images.filter(Boolean):[]}))};
}
function sync(){
  if(view!="form"||!$("fn"))return;
  const g=id=>$(id).value;
  Object.assign(cur,{Name:g("fn"),Category:g("fc"),Price:g("fp"),old_price:g("fop"),Stock:g("fs"),Description:g("fd"),sizes:g("fz"),sizes_out:g("fo"),badge:g("fb"),is_active:$("fa").checked});
  document.querySelectorAll("[data-cn]").forEach(i=>{cur.colors[+i.dataset.cn].name=i.value});
}
const thumbs=(arr,ci)=>arr.map((u,i)=>`<div class="th"><img src="${e(u)}" alt=""><button class="x" data-a="${ci==null?"rmi":"rmci"}" data-ci="${ci==null?"":ci}" data-i="${i}" aria-label="Retirer">×</button>${ci==null?(i?`<button class="st" data-a="main" data-i="${i}">★ Principale</button>`:'<span class="mn">Principale</span>'):""}</div>`).join("");
function renderForm(){
  const p=cur,cats=[...new Set(list.map(x=>x.Category).filter(Boolean))];
  app.innerHTML=`<div class="top"><h1>${p.isNew?"Nouveau produit":"Modifier"}</h1><button class="ghost" id="bk">‹ Retour</button></div>${msg()}
  <h2>Photos</h2><div class="mut">La première photo est celle de la vignette.</div>
  <div class="thumbs">${thumbs(p.images)}</div><input id="fi" type="file" accept="image/*" multiple>
  <label for="fn">Nom</label><input id="fn" value="${e(p.Name)}" placeholder="Ex : Maillot Bayern domicile">
  <label for="fc">Catégorie</label><input id="fc" list="cats" value="${e(p.Category)}" placeholder="Maillots, Chaussures, Vêtements…"><datalist id="cats">${cats.map(c=>`<option value="${e(c)}">`).join("")}</datalist>
  <label for="fp">Prix actuel ($)</label><input id="fp" inputmode="decimal" value="${e(p.Price)}" placeholder="19.99">
  <label for="fop">Prix barré, ancien prix ($) — pour une promotion</label><input id="fop" inputmode="decimal" value="${e(p.old_price)}" placeholder="Vide = pas de promo. Ex : 29.99">
  <div class="mut" style="margin:-6px 0 12px">Si tu mets un prix barré plus grand que le prix actuel, le site affiche l’ancien prix barré, le nouveau prix et un badge « −X% ». Pour finir la promo, vide ce champ.</div>
  <label for="fs">Stock (0 = épuisé)</label><input id="fs" inputmode="numeric" value="${e(p.Stock)}">
  <label for="fd">Description</label><textarea id="fd" rows="3">${e(p.Description)}</textarea>
  <h2>Tailles</h2>
  <label for="fz">Tailles proposées (séparées par des virgules)</label><input id="fz" value="${e(p.sizes)}" placeholder="Vide = automatique selon la catégorie">
  <div class="row2"><button class="ghost" data-a="sz" data-v="S, M, L, XL, XXL">S → XXL</button><button class="ghost" data-a="sz" data-v="38, 39, 40, 41, 42, 43, 44, 45">38 → 45</button><button class="ghost" data-a="sz" data-v="Unique">Taille unique</button></div>
  <label for="fo">Tailles épuisées</label><input id="fo" value="${e(p.sizes_out)}" placeholder="Ex : S, XXL">
  <label for="fb">Étiquette sur la vignette</label><input id="fb" list="bds" value="${e(p.badge)}" placeholder="Nouveau, Promo… (facultatif)"><datalist id="bds"><option value="Nouveau"><option value="Dernières pièces"></datalist>
  <h2>Couleurs</h2><div class="mut">Chaque couleur peut avoir ses propres photos. Sans photo, le client voit les photos principales.</div>
  ${p.colors.map((c,ci)=>`<div class="cb"><div class="cr"><span class="dot" style="background:${dot(c.name)}"></span><input data-cn="${ci}" list="cl" value="${e(c.name)}" placeholder="Nom (ex : Noir, ou Noir/Blanc)"><button class="ghost" data-a="rmc" data-ci="${ci}">Retirer</button></div>
  <div class="thumbs">${thumbs(c.images,ci)}</div><input type="file" accept="image/*" multiple data-cf="${ci}" style="margin-bottom:0"></div>`).join("")}
  <datalist id="cl">${Object.keys(CC).map(k=>`<option value="${e(cap(k))}">`).join("")}</datalist>
  <button class="ghost w" data-a="addc">+ Ajouter une couleur</button>
  <label class="chk" style="margin-top:14px"><input type="checkbox" id="fa" ${p.is_active?"checked":""}>Visible sur le site</label>
  <button class="btn" id="sv">Enregistrer</button>${p.isNew?"":'<button class="ghost w" id="dp" style="margin-top:10px">Dupliquer ce produit</button><button class="danger" id="dl">Supprimer ce produit</button>'}`;
  $("bk").onclick=()=>{sync();tab="products";go("main")};
  $("sv").onclick=saveForm;
  if($("dp"))$("dp").onclick=()=>{sync();cur=Object.assign(JSON.parse(JSON.stringify(cur)),{isNew:true,id:undefined,Name:cur.Name+" (copie)"});go("form","Copie créée : modifie-la puis enregistre.")};
  if($("dl"))$("dl").onclick=async()=>{if(!confirm("Supprimer définitivement « "+cur.Name+" » ?"))return;
    const r=await api("/rest/v1/products?id=eq."+cur.id,{method:"DELETE"});
    if(!r.ok){go("form",await errText(r),true);return}tab="products";go("main","Produit supprimé.",false,true)};
}
app.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-a]");if(!t||view!="form")return;
  sync();const a=t.dataset.a,i=+t.dataset.i,ci=+t.dataset.ci;
  if(a=="rmi")cur.images.splice(i,1);
  else if(a=="rmci")cur.colors[ci].images.splice(i,1);
  else if(a=="main"){const [u]=cur.images.splice(i,1);cur.images.unshift(u)}
  else if(a=="rmc")cur.colors.splice(ci,1);
  else if(a=="addc")cur.colors.push({name:"",images:[]});
  else if(a=="sz"){cur.sizes=t.dataset.v}
  else return;
  note="";renderForm();
});
app.addEventListener("change",ev=>{
  const t=ev.target;if(t.type!="file"||view!="form"||!t.files.length)return;
  const files=[...t.files];sync();
  const target=t.id=="fi"?cur.images:cur.colors[+t.dataset.cf].images;
  addFiles(files,target);
});
async function addFiles(files,target){
  note="Envoi des photos…";noteErr=false;noteOk=false;renderForm();
  try{for(const f of files){target.push(await upBlob(await shrink(f),"jpg"))}note=""}
  catch(err){note=err.message;noteErr=true}
  renderForm();
}
async function shrink(file){
  const b=await createImageBitmap(file),k=Math.min(1,1000/Math.max(b.width,b.height)),c=document.createElement("canvas");
  c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(b,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,"image/jpeg",.85));
}
async function upBlob(blob,ext){
  const fname=Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+(ext||"jpg");
  const up=await api("/storage/v1/object/"+BUCKET+"/"+fname,{method:"POST",headers:{"Content-Type":blob.type||"image/jpeg"},body:blob});
  if(!up.ok)throw new Error("Photo non envoyée. "+await errText(up));
  return SB.u+"/storage/v1/object/public/"+BUCKET+"/"+fname;
}
const num=v=>parseFloat(String(v).replace(",","."));
function rowOf(p){
  const price=num(p.Price),stock=parseInt(p.Stock,10),op=num(p.old_price);
  const cols=p.colors.map(c=>({name:c.name.trim(),images:c.images})).filter(c=>c.name);
  const first=p.images[0]||((cols.find(c=>c.images[0])||{images:[]}).images[0])||"";
  return{Name:p.Name.trim(),Category:p.Category.trim()||"Autres",Price:price,old_price:(!isNaN(op)&&op>price)?op:null,Stock:isNaN(stock)?0:stock,Description:p.Description.trim(),image_url:first,is_active:p.is_active,
    badge:p.badge.trim(),sizes:csz(p.sizes).join(", "),sizes_out:csz(p.sizes_out).join(", "),images:p.images,colors:cols};
}
async function saveForm(){
  sync();const b=$("sv");
  const showErr=m=>{let el=app.querySelector(".msg");if(!el){app.querySelector(".top").insertAdjacentHTML("afterend",'<div class="msg err"></div>');el=app.querySelector(".msg")}el.className="msg err";el.textContent=m;window.scrollTo(0,0)};
  if(!cur.Name.trim())return showErr("Le nom est obligatoire.");
  const price=num(cur.Price);
  if(isNaN(price)||price<0)return showErr("Le prix doit être un nombre, par exemple 19.99.");
  if(String(cur.old_price).trim()!==""){const op=num(cur.old_price);if(isNaN(op)||op<=price)return showErr("Le prix barré doit être plus grand que le prix actuel (ou laisse-le vide).")}
  b.disabled=true;b.textContent="Enregistrement…";
  try{
    const row=rowOf(cur);
    const r=cur.isNew
      ?await api("/rest/v1/products",{method:"POST",headers:{...JH,Prefer:"return=minimal"},body:JSON.stringify(row)})
      :await api("/rest/v1/products?id=eq."+cur.id,{method:"PATCH",headers:{...JH,Prefer:"return=minimal"},body:JSON.stringify(row)});
    if(!r.ok)throw new Error(await errText(r));
    tab="products";go("main","Enregistré. Le site est à jour.",false,true);
  }catch(err){b.disabled=false;b.textContent="Enregistrer";showErr(err.message)}
}

/* ---------- onglet Commandes ---------- */
const ST={nouvelle:"À traiter",payee:"Payée",livree:"Livrée",annulee:"Annulée"};
const waNum=p=>{let d=String(p||"").replace(/\D/g,"");if(d.startsWith("00"))d=d.slice(2);if(d.startsWith("0"))d="243"+d.slice(1);return d};
function orderHtml(o){
  const its=(o.items||[]).map(i=>e(itemTxt(i))).join("<br>");
  const others=Object.keys(ST).filter(k=>k!=o.status);
  const wa="https://wa.me/"+waNum(o.phone)+"?text="+encodeURIComponent("Bonjour "+(o.customer_name||"")+", ici JKSTORE au sujet de votre commande "+o.ref+".");
  return `<div class="oc" data-id="${o.id}"><div class="oh"><b>${e(o.ref)}</b><span class="tag s-${e(o.status)}">${e(ST[o.status]||o.status)}</span></div>
  <div class="mut">${e(dfmt(o.created_at))}</div>
  <div style="margin-top:4px"><b>${e(o.customer_name)}</b> · <a href="tel:${e(o.phone)}">${e(o.phone)}</a></div>
  <div class="mut">${e([o.commune,o.quartier,o.address].filter(Boolean).join(", "))}${o.landmark?" ("+e(o.landmark)+")":""}</div>
  <div class="its">${its||"—"}</div>
  <div class="mut">Articles ${money(o.subtotal)} · Livraison ${fcf(o.delivery_fee)} · Paiement : ${e(o.pay_method||"—")}${o.promo_code?" · Code "+e(o.promo_code):""}</div>
  <div class="ob">${others.map(k=>`<button class="ghost${k=="annulee"?" red":""}" data-s="${k}">${k=="nouvelle"?"Remettre à traiter":k=="payee"?"Marquer payée":k=="livree"?"Marquer livrée":"Annuler"}</button>`).join("")}<a class="ghost" href="${e(wa)}" target="_blank" rel="noopener" style="text-decoration:none">WhatsApp client</a>${o.status=="annulee"?'<button class="ghost red" data-del="1">Supprimer</button>':""}</div></div>`;
}
let orders=[];
async function paneOrders(){
  $("pane").innerHTML=`<div class="chips" id="of"></div><div id="ol"><p class="mut">Chargement…</p></div><button class="ghost w" id="expo" style="margin-top:14px">Exporter les commandes (CSV)</button>
  <p class="mut">Quand tu annules une commande, le stock des articles est remis automatiquement.</p>`;
  $("expo").onclick=ev=>exportOrders(ev.target);
  const draw=()=>{
    const cnt=k=>k=="all"?orders.length:orders.filter(o=>o.status==k).length;
    $("of").innerHTML=[["all","Toutes"],...Object.entries(ST)].map(([k,l])=>`<button class="chip${ofilter==k?" on":""}" data-f="${k}">${l} (${cnt(k)})</button>`).join("");
    const a=orders.filter(o=>ofilter=="all"||o.status==ofilter);
    $("ol").innerHTML=a.length?a.map(orderHtml).join(""):'<p class="mut">Aucune commande ici pour l’instant.</p>';
  };
  try{const r=await api("/rest/v1/orders?select=*&order=id.desc&limit=300");if(!r.ok)throw new Error(await errText(r));orders=await r.json();draw()}
  catch(err){$("ol").innerHTML=`<div class="msg err">${e(err.message)}</div>`;return}
  $("of").onclick=ev=>{const f=ev.target.dataset.f;if(f){ofilter=f;draw()}};
  $("ol").onclick=async ev=>{
    const btn=ev.target.closest("button");if(!btn)return;const oc=btn.closest(".oc");if(!oc)return;const id=+oc.dataset.id;
    if(btn.dataset.s){
      if(btn.dataset.s=="annulee"&&!confirm("Annuler cette commande ? Le stock sera remis."))return;
      btn.disabled=true;
      const r=await api("/rest/v1/rpc/admin_set_order_status",{method:"POST",headers:JH,body:JSON.stringify({p_id:id,p_status:btn.dataset.s})});
      if(!r.ok){alert(await errText(r));btn.disabled=false;return}
      const o=orders.find(x=>x.id==id);if(o)o.status=btn.dataset.s;draw();refreshBadge();
    }else if(btn.dataset.del){
      if(!confirm("Supprimer définitivement cette commande ?"))return;
      const r=await api("/rest/v1/orders?id=eq."+id,{method:"DELETE"});
      if(!r.ok){alert(await errText(r));return}
      orders=orders.filter(x=>x.id!=id);draw();
    }
  };
}

/* ---------- onglet Statistiques ---------- */
async function paneStats(){
  $("pane").innerHTML=`<div class="chips">${[7,30,90].map(d=>`<button class="chip${sdays==d?" on":""}" data-d="${d}">${d} jours</button>`).join("")}</div><div id="sb"><p class="mut">Chargement…</p></div>`;
  $("pane").querySelector(".chips").onclick=ev=>{const d=+ev.target.dataset.d;if(d){sdays=d;paneStats()}};
  try{
    const r=await api("/rest/v1/rpc/admin_stats",{method:"POST",headers:JH,body:JSON.stringify({p_days:sdays})});
    if(!r.ok)throw new Error(await errText(r));
    const s=await r.json(),days=s.days||[],mx=Math.max(1,...days.map(d=>d.visits)),top=s.top||[],tmx=Math.max(1,...top.map(t=>t.views));
    $("sb").innerHTML=`<div class="cards">
    <div class="card"><b>${s.visits}</b><span class="mut">Visites</span></div>
    <div class="card"><b>${s.visitors}</b><span class="mut">Visiteurs différents</span></div>
    <div class="card"><b>${s.product_views}</b><span class="mut">Fiches produit ouvertes</span></div>
    <div class="card"><b>${s.carts}</b><span class="mut">Ajouts au panier</span></div>
    <div class="card"><b>${s.orders}</b><span class="mut">Commandes</span></div>
    <div class="card"><b>${money(s.revenue)}</b><span class="mut">Ventes (articles)</span></div></div>
    <h2>Visites par jour</h2>
    <div class="bars">${days.map(d=>`<i title="${e(d.d)} : ${d.visits}" style="height:${Math.max(2,Math.round(d.visits/mx*100))}%"></i>`).join("")}</div>
    <div class="mut" style="display:flex;justify-content:space-between"><span>${e(days.length?days[0].d:"")}</span><span>max ${mx}/jour</span><span>${e(days.length?days[days.length-1].d:"")}</span></div>
    <h2>Produits les plus consultés</h2>
    ${top.length?top.map(t=>`<div class="tp"><div style="display:flex;justify-content:space-between;gap:8px"><b style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e(t.name)}</b><span class="mut" style="flex:none">${t.views} vues · ${t.carts} panier</span></div><div class="bar"><i style="width:${Math.round(t.views/tmx*100)}%"></i></div></div>`).join(""):'<p class="mut">Pas encore de données. Les statistiques se remplissent quand des clients visitent le site.</p>'}
    <p class="mut" style="margin-top:14px">Tes propres visites ne sont pas comptées sur cet appareil (réglable dans Réglages). Les visites d’un même téléphone sont comptées une fois par session.</p>`;
  }catch(err){$("sb").innerHTML=`<div class="msg err">${e(err.message)}</div>`}
}

/* ---------- onglet Réglages ---------- */
const SET_KEYS=["wa","fee","delay","fl","fl2","pay_airtel","pay_mpesa","banner"];
async function paneSettings(){
  $("pane").innerHTML='<p class="mut">Chargement…</p>';
  let o={};
  try{const r=await api("/rest/v1/settings?select=key,value");if(!r.ok)throw new Error(await errText(r));(await r.json()).forEach(x=>o[x.key]=x.value)}
  catch(err){$("pane").innerHTML=`<div class="msg err">${e(err.message)}</div>`;return}
  const nt=(()=>{try{return !!localStorage.getItem("jk_notrack")}catch(_){return false}})();
  $("pane").innerHTML=`<div id="sm"></div>
  <label for="s_wa">Numéro WhatsApp de la boutique (avec l’indicatif, sans +)</label><input id="s_wa" inputmode="numeric" value="${e(o.wa)}" placeholder="243824871399">
  <label for="s_bn">Bannière d’annonce en haut du site (vide = aucune)</label><input id="s_bn" value="${e(o.banner)}" placeholder="Ex : Promo du week-end −20%">
  <h2>Livraison</h2>
  <label for="s_fee">Frais de livraison (FC)</label><input id="s_fee" inputmode="numeric" value="${e(o.fee)}">
  <label for="s_delay">Délai de livraison</label><input id="s_delay" value="${e(o.delay)}" placeholder="24 à 48 h">
  <h2>Flocage maillots ($)</h2>
  <label for="s_fl">Flocage simple</label><input id="s_fl" inputmode="decimal" value="${e(o.fl)}">
  <label for="s_fl2">Double flocage</label><input id="s_fl2" inputmode="decimal" value="${e(o.fl2)}">
  <h2>Paiement</h2>
  <label for="s_pa">Numéro Airtel Money</label><input id="s_pa" value="${e(o.pay_airtel)}">
  <label for="s_pm">Numéro M-Pesa</label><input id="s_pm" value="${e(o.pay_mpesa)}">
  <h2>Cet appareil</h2>
  <label class="chk"><input type="checkbox" id="s_nt" ${nt?"checked":""}>Ne pas compter mes visites dans les statistiques</label>
  <button class="btn" id="s_sv">Enregistrer les réglages</button>
  <p class="mut" style="margin-top:12px">Les changements sont visibles sur le site dès le prochain chargement de la page.</p>`;
  $("s_nt").onchange=ev=>{try{if(ev.target.checked){localStorage.setItem("jk_notrack","1");localStorage.removeItem("jk_notrack_off")}else{localStorage.removeItem("jk_notrack");localStorage.setItem("jk_notrack_off","1")}}catch(_){}};
  $("s_sv").onclick=async()=>{
    const say=(m,bad)=>{const el=$("sm");el.innerHTML=`<div class="msg${bad?" err":" ok"}">${e(m)}</div>`;window.scrollTo(0,0)};
    const wa=$("s_wa").value.replace(/\D/g,""),fee=num($("s_fee").value),fl=num($("s_fl").value),fl2=num($("s_fl2").value);
    if(wa.length<8)return say("Le numéro WhatsApp doit contenir l’indicatif et le numéro (chiffres seulement).",true);
    if(isNaN(fee)||fee<0)return say("Les frais de livraison doivent être un nombre (en FC).",true);
    if(isNaN(fl)||fl<0||isNaN(fl2)||fl2<0)return say("Les prix de flocage doivent être des nombres (par exemple 4.99).",true);
    if(!$("s_delay").value.trim())return say("Indique un délai de livraison.",true);
    const b=$("s_sv");b.disabled=true;b.textContent="Enregistrement…";
    const rows=[{key:"wa",value:wa},{key:"fee",value:String(fee)},{key:"delay",value:$("s_delay").value.trim()},{key:"fl",value:String(fl)},{key:"fl2",value:String(fl2)},{key:"pay_airtel",value:$("s_pa").value.trim()},{key:"pay_mpesa",value:$("s_pm").value.trim()},{key:"banner",value:$("s_bn").value.trim()}];
    try{const r=await api("/rest/v1/settings?on_conflict=key",{method:"POST",headers:{...JH,Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(rows)});
      if(!r.ok)throw new Error(await errText(r));say("Réglages enregistrés. Le site est à jour.")}
    catch(err){say(err.message,true)}
    b.disabled=false;b.textContent="Enregistrer les réglages";
  };
}
render();
